services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: df_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: almacen
      DB_USER: root
      DB_PASS: root
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: df_db
    restart: unless-stopped
    command: --character-set-server=utf8 --collation-server=utf8_spanish_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: almacen
    ports:
      - "3308:3306"
    volumes:
      - df_dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: df_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  df_dbdata: